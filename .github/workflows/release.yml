name: Electron Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            build-script: build:linux
          - os: windows-2022
            build-script: build:windows
          - os: macos-15
            build-script: build:mac
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Check tag matches package.json version
        shell: bash
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$PKG_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi

      # EVS (castLabs VMP signing). Required on Windows; experimental on Linux
      # (the Linux Widevine CDM has no VMP, so build/evs-sign.js treats Linux failures as warnings).
      - name: Set up Python for EVS signing
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install EVS client
        run: python -m pip install --upgrade castlabs-evs

      - name: Check EVS credentials
        if: runner.os != 'Linux'
        shell: bash
        env:
          EVS_ACCOUNT_NAME: ${{ secrets.EVS_ACCOUNT_NAME }}
          EVS_PASSWD: ${{ secrets.EVS_PASSWD }}
        run: |
          if [ -z "$EVS_ACCOUNT_NAME" ] || [ -z "$EVS_PASSWD" ]; then
            echo "::error::EVS_ACCOUNT_NAME / EVS_PASSWD repository secrets are missing or empty"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci
        env:
          # electron comes from a castLabs GitHub URL; npm 12 blocks git dependencies by default.
          # "root" is unreliable on npm 11 (npm/cli#9189), so use "all".
          NPM_CONFIG_ALLOW_GIT: all

      - name: Test
        run: npm test

      # Apple signing is optional. CSC_LINK must be left UNSET (not empty) when there is no
      # certificate, otherwise electron-builder tries to read an empty path and fails.
      - name: Configure macOS code signing
        if: runner.os == 'macOS'
        shell: bash
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
        run: |
          if [ -n "$MAC_CSC_LINK" ]; then
            echo "CSC_LINK=$MAC_CSC_LINK" >> "$GITHUB_ENV"
            echo "CSC_KEY_PASSWORD=$MAC_CSC_KEY_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "No MAC_CSC_LINK secret set; building unsigned macOS app"
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
          fi

      - name: Build Electron packages
        run: npm run ${{ matrix.build-script }}
        env:
          # Used by build/evs-sign.js (afterSign hook).
          EVS_ACCOUNT_NAME: ${{ secrets.EVS_ACCOUNT_NAME }}
          EVS_PASSWD: ${{ secrets.EVS_PASSWD }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: electron-${{ matrix.os }}
          path: |
            dist-electron/*.exe
            dist-electron/*.AppImage
            dist-electron/*.deb
            dist-electron/*.rpm
            dist-electron/*.blockmap
            dist-electron/latest*.yml
            dist-electron/*.dmg
            dist-electron/*.pkg
            dist-electron/*.zip
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: dist-electron
          merge-multiple: true

      - name: Publish draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist-electron/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}